name: Python CI Pipeline

permissions:
  contents: read

env:
  APP_NAME: MyPythonApp

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  # JOB 1: TEST WITH MULTIPLE PYTHON VERSIONS
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    outputs:
      app_version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-html

      - name: Run tests
        run: pytest -v --html=report.html --self-contained-html

      - name: Generate application version
        id: version
        run: echo "value=1.0" >> "$GITHUB_OUTPUT"

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.python-version }}
          path: report.html

      - name: Confirm tests passed
        if: success()
        run: echo "All tests passed successfully!"

      - name: Show failure message
        if: failure()
        run: echo "Something went wrong in the pipeline!"

      - name: Display application name
        run: echo "$APP_NAME"

      - name: Verify GitHub secret
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "$DEMO_PASSWORD" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

  # JOB 2: REUSABLE WORKFLOW
  reusable_checks:
    needs: test
    uses: ./.github/workflows/reusable-checks.yml

  # JOB 3: STAGING DEPLOYMENT
  deploy_staging:
    needs: [test, reusable_checks]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Verify staging secret
        env:
          API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Staging secret is available"
          else
            echo "Staging secret is missing"
            exit 1
          fi

      - name: Deploy to staging
        run: echo "Deploying application to staging!"

  # JOB 4: PRODUCTION DEPLOYMENT
  deploy_production:
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify production secret
        env:
          API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Production secret is available"
          else
            echo "Production secret is missing"
            exit 1
          fi

      - name: Deploy to production
        run: echo "Deploying application to production!"