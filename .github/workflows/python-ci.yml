name: Python CI Pipeline

env:
  APP_NAME: MyPythonApp

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
    outputs:
      app_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest pytest-html
      - name: Run tests
        run: pytest -v --html=report.html --self-contained-html
      - name: Generate application version
        id: version
        run: echo "value=1.0" >> "$GITHUB_OUTPUT"
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.html
      - name: Confirm tests passed
        if: success()
        run: echo "All tests passed successfully!"


      - name: Display application name
        run: echo $APP_NAME

      - name: Verify GitHub secret
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -n "$DEMO_PASSWORD" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

  code_check:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m compileall .
      - name: Display application version
        run: echo "Version is ${{ needs.test.outputs.app_version }}"